# Tests run against a real PostgreSQL: the Compose dev database locally
# (`docker compose up -d db`), or the services container in CI. Override the
# URL with SPRING_DATASOURCE_URL if yours differs.
spring.datasource.url=${TEST_DATASOURCE_URL:jdbc:postgresql://localhost:5433/teamweave}
spring.datasource.username=teamweave
spring.datasource.password=teamweave

spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
