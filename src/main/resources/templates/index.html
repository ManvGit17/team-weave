<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>teamweave — students</title>
</head>
<body>

<h1>teamweave</h1>
<p>Students available for team formation.</p>

<h2>Add a student</h2>
<form th:action="@{/students}" th:object="${studentForm}" method="post">
    <label>Name: <input type="text" th:field="*{name}"/></label>
    <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
    <br/>
    <label>Email: <input type="email" th:field="*{email}"/></label>
    <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
    <br/>
    <button type="submit">Add student</button>
</form>

<hr/>

<h2>Roster</h2>
<table border="1">
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>Skills</th>
        <th>Desired roles</th>
    </tr>
    <tr th:each="student : ${students}">
        <td th:text="${student.id}"></td>
        <td th:text="${student.name}"></td>
        <td th:text="${student.email}"></td>
        <td>
            <span th:each="rating : ${student.skills}"
                  th:text="${rating.skill + ' (' + rating.level + ')'}">skill</span>
        </td>
        <td>
            <span th:each="role : ${student.desiredRoles}" th:text="${role}">role</span>
        </td>
    </tr>
</table>

</body>
</html>
