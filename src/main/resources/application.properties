spring.application.name=teamweave

spring.datasource.url=jdbc:postgresql://localhost:5433/teamweave
spring.datasource.username=teamweave
spring.datasource.password=teamweave

# Flyway owns the schema; JPA only validates its mapping against it.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Fingerprint static files (app-<hash>.css) so browsers never serve a stale copy.
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**

# Track the session (the formation board) by cookie only, never in URLs.
server.servlet.session.tracking-modes=cookie

# Where the "How it's built" page links to the source.
teamweave.source-url=https://github.com/ManvGit17/team-weave/blob/main
