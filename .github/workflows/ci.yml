name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: teamweave
          POSTGRES_USER: teamweave
          POSTGRES_PASSWORD: teamweave
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U teamweave -d teamweave"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test
        run: ./mvnw -B verify
